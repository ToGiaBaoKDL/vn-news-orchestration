[project]
name = "vn-news-orchestration"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "apache-airflow-providers-docker>=4.4.0",
]

[dependency-groups]
dev = [
  "ruff>=0.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
