name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out orchestration
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.12"

      - name: Verify Python
        run: |
          uv sync --frozen --all-groups
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Airflow image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: local/vn-news-airflow:ci
          cache-from: type=gha,scope=vn-news-airflow
          cache-to: type=gha,mode=max,scope=vn-news-airflow
