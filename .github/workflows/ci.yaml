name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out orchestration
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.12"

      - name: Verify Python
        run: |
          uvx --from ruff==0.15.0 ruff check --select E,F,I,B,UP,SIM --target-version py312 --line-length 100 .
          uvx --from ruff==0.15.0 ruff format --check --line-length 100 .
          python -m compileall -q dags news_orchestration
